name: Build macOS App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-state: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --onedir --windowed --name="noodle_app" stock_metrics.py
        # แก้ตรง "noodle_app" เป็นชื่อแอปที่ต้องการ และ your_script.py เป็นชื่อไฟล์ของคุณ

    - name: Zip the App Bundle
      run: |
        cd dist
        zip -r ../noodle_app-macOS.zip noodle_app.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Application
        path: noodle_app-macOS.zip
